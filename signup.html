<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - FundWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">
                FundWise
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my-accounts.html">My Accounts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="virtual-account.html">Virtual Account</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-light text-success fw-semibold" href="login.html">
                            Sign In
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center fw-bold mb-2">Create Account</h2>
                <p class="text-center text-muted mb-4">Join FundWise and start managing your money.</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your full name" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Create a password" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="Confirm your password" />
                    </div>
                    <button type="button" class="btn btn-primary w-100">Create Account</button>
                </form>
                <p class="text-center mt-4 mb-0">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-1 fw-semibold">FundWise</p>
        <small>Virtual Banking and Budget Management System</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="assets/app.js"></script>
</body>
</html>
